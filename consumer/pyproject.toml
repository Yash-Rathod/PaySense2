[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paysense-consumer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mlflow>=2.12",
    "numpy>=1.26",
    "xgboost>=2.0",
    "boto3>=1.34",
    "confluent-kafka>=2.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "prometheus-client>=0.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
