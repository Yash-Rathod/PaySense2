[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paysense-producer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faker>=24.0",
    "click>=8.1",
    "confluent-kafka>=2.3",
    "pydantic>=2.6",
    "prometheus-client>=0.20",
]

[project.scripts]
producer = "producer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
