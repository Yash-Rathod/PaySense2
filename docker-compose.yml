services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic results --partitions 3 --replication-factor 1 &&
        echo 'Topics created.'
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  mlflow:
    image: python:3.12-slim
    command: >
      sh -c "pip install --no-cache-dir 'setuptools<81' 'mlflow==3.12.*'
      && mlflow server
      --backend-store-uri sqlite:////ml/mlflow.db
      --default-artifact-root /ml/mlruns
      --host 0.0.0.0
      --port 5000
      --allowed-hosts localhost,127.0.0.1,mlflow,localhost:5000,mlflow:5000,127.0.0.1:5000"
    ports:
      - "5000:5000"
    volumes:
      - ./ml:/ml

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  dynamodb-init:
    image: amazon/aws-cli:latest
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    command: >
      dynamodb create-table
        --table-name transactions
        --attribute-definitions AttributeName=transaction_id,AttributeType=S
        --key-schema AttributeName=transaction_id,KeyType=HASH
        --billing-mode PAY_PER_REQUEST
        --endpoint-url http://dynamodb-local:8000

  producer:
    build: ./producer
    image: paysense-producer:dev
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_TRANSACTIONS: transactions
    # NOTE: --mode kafka is added to cli.py in Task 3. This service works after Task 3 is complete.
    command: ["--rows", "100", "--fraud-rate", "0.1", "--tps", "10", "--mode", "kafka"]
    ports:
      - "9090:9090"
    profiles: ["app"]

  consumer:
    build: ./consumer
    image: paysense-consumer:dev
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      dynamodb-local:
        condition: service_started
      mlflow:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_TRANSACTIONS: transactions
      KAFKA_TOPIC_RESULTS: results
      KAFKA_GROUP_ID: paysense-consumer
      MODEL_URI: file:///ml/mlruns/1/models/m-8a22581637744e798bea2a5e005e6979/artifacts
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DYNAMODB_TABLE: transactions
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./ml:/ml
    ports:
      - "8001:8001"
      - "9091:9091"
    profiles: ["app"]

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9094:9090"
    volumes:
      - ./infra/helm/monitoring/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "paysense"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana-data:
