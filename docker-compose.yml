version: "3.9"

services:
  producer:
    build: ./producer
    image: paysense-producer:dev
    command: ["--rows", "100", "--fraud-rate", "0.1", "--tps", "10"]

  consumer:
    build: ./consumer
    profiles: ["app"]

  mlflow:
    image: python:3.12-slim
    command: >
      sh -c "pip install --no-cache-dir 'setuptools<81' 'mlflow==3.12.*'
      && mlflow server
      --backend-store-uri sqlite:////ml/mlflow.db
      --default-artifact-root /ml/mlruns
      --host 0.0.0.0
      --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - ./ml:/ml

volumes:
  mlflow-data:
