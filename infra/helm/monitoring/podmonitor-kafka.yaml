apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka
  namespace: paysense
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      strimzi.io/cluster: kafka-cluster
  podMetricsEndpoints:
    - port: tcp-prometheus
      interval: 15s
      path: /metrics
